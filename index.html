<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="https://static.vecteezy.com/system/resources/thumbnails/069/732/520/small/3d-clipboard-with-blue-frame-and-financial-checklist-stacked-gold-coins-with-dollar-sign-isolated-on-pure-transparent-background-free-png.png"
      type="image/x-icon"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="index.css" />
    <title>Expense Tracker</title>
  </head>

  <body>
    <header id="head">
      <h1 class="title">Expense Tracker App</h1>
      <div class="mains-container">
        <div class="sub-container">
          <h3>TOTAL INCOME</h3>
          <div class="amount-text income-amount">Rs. 0</div>
        </div>
        <div class="sub-container">
          <h3>TOTAL EXPENSES</h3>
          <div class="amount-text expense-amount">Rs. 0</div>
        </div>
        <div class="sub-container">
          <h3>TOTAL BALANCE</h3>
          <div class="amount-text balance-amount">Rs. 0</div>
        </div>
      </div>
    </header>

    <main id="main-container">
      <section class="forms">
        <h2 id="heading">ADD TRANSACTION</h2>
        <form id="tx-form" onsubmit="onAddTransaction(event)">
          <div class="input-group">
            <label>Transaction Type</label>
            <div class="type-options">
              <label>
                <input type="radio" name="type" value="income" required />
                Income (+)
              </label>
              <label>
                <input
                  type="radio"
                  name="type"
                  value="expense"
                  checked
                  required
                />
                Expense (-)
              </label>
            </div>
          </div>
          <div class="input-group">
            <label for="amount">Amount (Rs.)</label>
            <input
              type="number"
              id="amount"
              placeholder="Enter amount"
              min="0.01"
              step="0.01"
              required
            />
          </div>
          <div class="input-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="" disabled selected>Select Category</option>
              <option value="Salary">Salary / Freelance</option>
              <option value="Food">Food & Dining</option>
              <option value="Rent">Rent & Bills</option>
              <option value="Shopping">Shopping</option>
              <option value="Travel">Travel & Fuel</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="input-group">
            <label for="date">Date</label>
            <input type="date" id="date" required />
          </div>
          <div class="input-group">
            <label for="description">Description</label>
            <textarea
              id="description"
              rows="3"
              placeholder="Enter description"
              required
            ></textarea>
          </div>
          <button type="submit" id="submitBtn">Add Transaction</button>
        </form>
      </section>

      <section class="forms transactions-section">
        <h2>TRANSACTIONS</h2>
        <div class="filter">
          <div class="input-group">
            <label for="filterType">Select Type</label>
            <select id="filterType" onchange="onFilterChange()">
              <option value="all">All Types</option>
              <option value="income">Income</option>
              <option value="expense">Expense</option>
            </select>
          </div>

          <div class="input-group">
            <label for="filterCategory">Select Category</label>
            <select id="filterCategory" onchange="onFilterChange()">
              <option value="all">All Categories</option>
              <option value="Salary">Salary / Freelance</option>
              <option value="Food">Food & Dining</option>
              <option value="Rent">Rent & Bills</option>
              <option value="Shopping">Shopping</option>
              <option value="Travel">Travel & Fuel</option>
              <option value="Other">Other / Misc</option>
            </select>
          </div>
        </div>

       
        <div class="table-responsive mt-4">
          <table
            class="table table-dark table-striped table-bordered table-hover align-middle"
          >
            <thead>
              <tr class="text-center">
                <th scope="col" style="width: 5%">#</th>
                <th scope="col" style="width: 15%">Date</th>
                <th scope="col" style="width: 25%">Description</th>
                <th scope="col" style="width: 12%">Type</th>
                <th scope="col" style="width: 15%">Category</th>
                <th scope="col" style="width: 13%">Amount</th>
                <th scope="col" style="width: 15%">Actions</th>
              </tr>
            </thead>
            <tbody id="transaction-rows" class="text-center">
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
